[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enex2onenote"
version = "0.1.0"
description = "Migrate Evernote .enex exports to OneNote, using Claude to generate trustworthy titles and tags"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "fonttools>=4.40",  # lets pypdf decode CFF/Type1 font encodings when extracting PDF text
    "msal>=1.28",
    "pypdf>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Upload through the OneNote desktop app instead of Microsoft Graph (Windows only)
com = ["pywin32>=306; sys_platform == 'win32'", "pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
enex2onenote = "enex2onenote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["onenote: writes to the real OneNote desktop app (opt-in: ENEX2ONENOTE_LIVE_ONENOTE=1)"]
